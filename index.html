<title>牙套 A4 產生器</title>

<style>

*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC','Noto Sans JP',system-ui,sans-serif;background:#f4f7f6;color:#1c2823;padding:0 0 40px}
.top{background:var(--teal-d);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:11px;background:#fff;color:var(--teal-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.top h1{margin:0;font-size:19px}.top .sub{font-size:12px;opacity:.85;margin-top:2px}
.wrap{max-width:640px;margin:16px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;color:var(--teal-d)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.fld{display:block;margin-bottom:10px}
label.fld .lab{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.ipt{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;margin:0 12px 8px 0;font-size:14px;cursor:pointer}
.chk input{width:17px;height:17px}
.btn{display:inline-block;padding:12px 18px;border-radius:10px;border:none;background:var(--teal);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:4px}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;background:#fff;padding:9px 14px;font-size:14px;cursor:pointer;color:#333}
.seg button.on{background:var(--teal);color:#fff;font-weight:700}

<div class="top"><div class="logo">朗</div><div><h1>牙套 A4 產生器</h1><div class="sub">總表 · 逐副貼紙（US2610 75格）</div></div></div>
<div class="wrap">

  <label class="fld"><span class="lab">PID（選填）</span><input class="ipt" id="f_pid" placeholder="12345678"></label>

</div>
</div>

<div class="card">
<h2>A4 牙套更換總表</h2>
<div class="row" style="margin-bottom:10px">
  <label class="chk"><input type="checkbox" id="f_paid"> 一次付清（印「已付清」）</label>
  <label class="chk"><input type="checkbox" id="f_mono"> 黑白列印</label>
</div>
<button class="btn big" onclick="genA4()">🖨️ 產生 A4 總表</button>
<div class="hint">回診時間依規則自動標記（第一輪 5/13/21…＋最後一副；其他輪 8/16/24…；IPE 每 30 天；與最後一副相差 4 副以內自動略過）。</div>
</div>

<div class="card">
<h2>A4 逐副貼紙（US2610 · 5×15 · 42×19.5mm）</h2>
<div class="lab" style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">樣式</div><div class="seg" style="margin-bottom:10px"><button type="button" id="segC" class="on" onclick="pickStyle('C')">C · 日期大＋黑條</button><button type="button" id="segD" onclick="pickStyle('D')">D · 日期最大</button></div><input type="hidden" id="lb_style" value="C"><input type="checkbox" id="lb_styleD" style="display:none"><div class="lab" style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">要印哪些欄位</div>

  <label class="chk"><input type="checkbox" id="lb_name" checked> 姓名</label>
  <label class="chk"><input type="checkbox" id="lb_stage" checked> 第N副</label>
  <label class="chk"><input type="checkbox" id="lb_wear" checked> 起戴日</label>
  <label class="chk"><input type="checkbox" id="lb_change"> 換套日</label>
  <label class="chk"><input type="checkbox" id="lb_pid"> PID</label>
</div>
<div class="lab" style="font-size:12px;color:var(--muted);margin:8px 0 6px;font-weight:600">列印校準（印歪了再微調，單位 mm）</div>
<div class="row" style="align-items:center;margin-bottom:10px">
  <label class="chk" style="margin:0">左右 <input class="ipt" id="cal_x" type="number" step="0.5" value="0" style="width:76px;padding:7px 9px;margin-left:6px"></label>

<button class="btn big" onclick="printLabels()">🖨️ 產生 A4 貼紙</button>

</div>

<div class="hint" style="text-align:center">可加入主畫面當 App 使用 · 離線可用</div>
</div>

  const roundLabel=(rn)=>({zh:'第 '+cnZh(rn)+' 輪',ja:'第'+rn+'ラウンド',en:'Round '+rn})[lang];
  const multi=roundsData.length>1;
  const sections=roundsData.map((rd,idx)=>{const vset=vsets[idx];const isV=(n)=>vset.has(n);const rows=rd.stages.map((sc,i)=>rowBlock(sc,i,isV)).join('');const rgTxt=(n)=>lang==='zh'?('第 1–'+n+' 副'):('Stage 1–'+n);const hd=multi?`<div class="rdhead">${roundLabel(rd.round)}（${rgTxt(rd.stages[rd.stages.length-1].no)}）</div>`:'';return hd+`<div class="sched">${thead}${rows}</div>`;}).join('');
  const clinic=esc(CONFIG.clinicName||'BBL CRM System');const name=esc(docName(p,lang));const pid=p.invisalignPID?('PID '+algPID8(p.invisalignPID)):'';const phone=esc(CONFIG.clinicPhone||'');
  let vp=[];if(wt==='ipe'){vp=[{zh:'IPE 每 30 天回診一次',ja:'IPEは30日ごとに来院',en:'IPE: every 30 days'}[lang]];}else{vp.push({zh:'第一輪：第 5 副後首次、之後每 8 副',ja:'第1R：ステージ5後・以降8ごと',en:'Round 1: after Stage 5, then every 8'}[lang]);if(multi)vp.push({zh:'其他輪：每 8 副',ja:'他R：8ごと',en:'Others: every 8'}[lang]);}
  vp.push({zh:'各輪最後一副也需回診',ja:'各Rの最終ステージも来院',en:'last stage of each round too'}[lang]);
  const vnote=(lang==='en'?'':'※ ')+{zh:'請在標有鈴鐺圖示的副數回診',ja:'ベルのマークがある場合は、クリニックの受診予約をお取りください。',en:'When you see the bell icon, please schedule a clinic visit.'}[lang];
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(T.title)}</title><style>@page{size:A4;margin:10mm}*{font-family:'Noto Sans TC','Noto Sans JP','Noto Sans CJK TC',sans-serif;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{color:${C.ink};margin:0}.hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid #111;padding-bottom:8px}.logo{width:46px;height:46px;border-radius:11px;background:${C.logo};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}.clinic{font-size:15px;color:#333}.ttl{font-size:23px;font-weight:800;color:${C.accent};margin-top:2px}.pt{margin:10px 0 4px;font-size:15px}.pt b{font-size:23px}.rule{background:${C.ruleBg};color:${C.ruleColor};border:${C.ruleBorder};text-align:center;font-weight:800;padding:10px;border-radius:9px;margin:8px 0;font-size:17px}.rdhead{font-size:17px;font-weight:800;color:${C.accent};margin:14px 0 4px;break-after:avoid;break-inside:avoid}.sched{column-count:2;column-gap:18px;column-fill:balance}.thead{column-span:all;display:flex;gap:18px;margin-bottom:2px;break-inside:avoid}.thc{flex:1;display:grid;grid-template-columns:58px 1fr 1fr;gap:6px;background:${C.th};color:${C.thc};font-weight:800;font-size:${Z.th}px;padding:6px 9px;border-bottom:2px solid ${C.thb}}.grp{break-inside:avoid}.fill{background:${mono?'#fafafa':'#fffaf2'};border-left:3px solid ${C.vbBg};border-bottom:1px solid #dcdcdc;padding:4px 8px 5px}.fl{display:flex;align-items:flex-end;gap:6px;margin-top:3px;font-size:${Z.fl}px}.flab{color:${mono?'#333':'#8a6320'};font-weight:800;white-space:nowrap}.fline{flex:1;border-bottom:1px solid ${mono?'#999':'#e2be8c'};min-height:${Z.flh}px;position:relative}.fpaid{display:inline-block;padding:0 4px;font-weight:800;color:${mono?'#000':'#2b7a6e'};font-size:${Z.fl}px;white-space:nowrap}.fhint{position:absolute;left:3px;bottom:1px;font-size:${Z.hint}px;color:${mono?'#aaa':'#d8c3a0'};font-weight:400;white-space:nowrap}.r{display:grid;grid-template-columns:58px 1fr 1fr;gap:6px;align-items:center;padding:${Z.pad};border-bottom:1px solid #dcdcdc;font-size:${Z.row}px;break-inside:avoid}.r.alt{background:${C.even}}.r.vrow{background:${C.vrow};font-weight:800}.r .st{font-weight:800}.r .ch{color:${C.ch}}.wd{color:${C.wd};font-size:${Z.wd}px}.vbadge{display:inline-block;margin-left:8px;background:${C.vbBg};color:${C.vbC};font-size:${Z.badge}px;padding:1px 7px;border-radius:20px;vertical-align:1px}.care{margin-top:10px;font-size:14px;color:${mono?'#222':'#33443c'};line-height:1.6;break-inside:avoid}.vnote{margin-top:6px;font-size:12px;color:${C.vnote};font-weight:700;break-inside:avoid}.notebox{margin-top:8px;padding:8px 11px;border:2px solid ${mono?'#888':'#e0cea6'};background:${mono?'#f7f7f7':'#faf7ee'};border-radius:8px;font-size:13px;line-height:1.5;color:${mono?'#222':'#5a4a2c'};break-inside:avoid}.ft{margin-top:10px;border-top:2px solid #111;padding-top:7px;display:flex;justify-content:space-between;font-size:12px;color:#555;break-inside:avoid}</style></head><body><div class="hd"><div class="logo">朗</div><div><div class="clinic">${clinic}</div><div class="ttl">${esc(T.title)}</div></div></div><div class="pt"><b>${name}</b> &nbsp; ${esc(pid)}</div><div class="rule">${esc(ruleTxt)}</div>${sections}<div class="vnote">${vnote}</div><div class="notebox">${esc(FT.note)}</div><div class="care">${careArr.map(c=>'• '+esc(c)).join('<br>')}</div><div class="ft"><span>${clinic}　${phone}</span><span>${esc(T.printed)} ${todayStr()}</span></div></body></html>`;
  const w=window.open('','_blank');if(!w){toast('請允許彈出視窗以列印');return;}w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();w.print();}catch(_){}} ,350);
}

/* ===== 精簡 helper（獨立版）===== */
var CONFIG={clinicName:'',clinicPhone:'',docLang:'zh'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.style.opacity='1';clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.style.opacity='0';},2600);}
function algPID8(x){return x;}
function displayName(p){return p.name||'';}
function enName(p){return p.en||'';}
function docName(p,lang){var zh=displayName(p);if(lang&&lang!=='zh'){var en=enName(p);if(en&&en!==zh)return zh+'（'+en+'）';}return zh;}
function computeFollowup(f){var from=parseInt(f.alignerFrom,10),to=parseInt(f.alignerTo,10),days=parseInt(f.daysPerAligner,10),base=f.startWearDate;var out={ok:false,schedule:[]};if(!base||isNaN(from)||isNaN(to)||isNaN(days)||days<=0||to<from)return out;function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}for(var k=from;k<=to;k++){var d0=new Date(base+'T00:00:00');d0.setDate(d0.getDate()+(k-from)*days);var d1=new Date(d0);d1.setDate(d1.getDate()+days-1);out.schedule.push({no:k,wearDate:ymd(d0),changeDate:ymd(d1)});}out.ok=true;return out;}


/* ===== A4 貼紙（US2610 5x15 / 42x19.5mm）===== */
function buildPatient(){
  var name=document.getElementById('f_name').value.trim();
  var en=document.getElementById('f_en').value.trim();
  var pid=document.getElementById('f_pid').value.trim();
  var from=parseInt(document.getElementById('f_from').value,10);
  var to=parseInt(document.getElementById('f_to').value,10);
  var start=document.getElementById('f_start').value;
  var days=parseInt(document.getElementById('f_days').value,10)||7;
  var wt=document.getElementById('f_wear').value;
  if(isNaN(from)||from<1)from=1;
  if(isNaN(to)||to<1){toast('請輸入結束副');return null;}
  if(to<from){var _t=from;from=to;to=_t;}
  if(!start){toast('請選擇起戴日');return null;}
  CONFIG.clinicName=document.getElementById('f_clinic').value.trim()||'BBL CRM System';
  CONFIG.clinicPhone=document.getElementById('f_phone').value.trim();
  return {name:name||'（未命名）',en:en,invisalignPID:pid,wearType:wt,
    followups:[{id:'f1',round:1,alignerFrom:from,alignerTo:to,daysPerAligner:days,startWearDate:start}]};
}
function stageList(p){var c=computeFollowup(p.followups[0]);return c.ok?c.schedule:[];}
function mmdd(ds){var d=new Date(ds+'T00:00:00');if(isNaN(d))return ds;return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function labelLangTxt(lang){return {zh:{stage:'第 %n 副',wear:'起戴',change:'換套',visit:'回診'},
  ja:{stage:'ステージ %n',wear:'装着',change:'交換',visit:'来院'},
  en:{stage:'Stage %n',wear:'Wear',change:'Change',visit:'Visit'}}[lang]||{stage:'第 %n 副',wear:'起戴',change:'換套',visit:'回診'};}
function algA4LabelSheetHTML(stages,o){
  var mmdd=function(ds){var d=new Date(ds+'T00:00:00');if(isNaN(d))return ds;return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');};
  var LT={zh:{stage:'第 %n 副',wear:'起戴',change:'換'},ja:{stage:'ステージ %n',wear:'装着',change:'交換'},en:{stage:'St.%n',wear:'Wear',change:'Chg'}}[o.lang]||{stage:'第 %n 副',wear:'起戴',change:'換'};
  var fl=o.fields, style=o.style||'C';
  var TOOTH='<svg viewBox="0 0 24 24" class="tth"><path d="M12 2C8 2 5.5 3.6 5.5 7c0 2.2.6 4.3 1.1 7 .4 2.2.6 6 2.1 6 1.1 0 1.1-2.2 1.6-4.2.3-1.2.5-2.1 1.7-2.1s1.4.9 1.7 2.1c.5 2 .5 4.2 1.6 4.2 1.5 0 1.7-3.8 2.1-6 .5-2.7 1.1-4.8 1.1-7C18.5 3.6 16 2 12 2z"/></svg>';
  function cellC(sc){
    var head=[];
    if(fl.name)head.push('<span>'+esc(o.nm)+'</span>');
    if(fl.stage)head.push('<span class="hstage">'+esc(LT.stage.replace('%n',sc.no))+'</span>');
    if(fl.pid&&o.pid)head.push('<span class="hpid">'+esc(o.pid)+'</span>');
    var big=[];
    if(fl.wear)big.push('<span class="lwlab">'+(o.mono?'':TOOTH)+esc(LT.wear)+'</span><span class="lbig">'+mmdd(sc.wearDate)+'</span>');
    else if(fl.change)big.push('<span class="lwlab">'+esc(LT.change)+'</span><span class="lbig">'+mmdd(sc.changeDate)+'</span>');
    var sub=(fl.wear&&fl.change)?'<div class="csub">'+esc(LT.change)+' '+mmdd(sc.changeDate)+'</div>':'';
    return '<div class="cell">'+(head.length?'<div class="lhead">'+head.join('　')+'</div>':'')+'<div class="lbody">'+(big.join('')||('<span class="lbig">'+sc.no+'</span>'))+'</div>'+sub+'</div>';
  }
  function cellD(sc){
    var top=[];
    if(fl.name)top.push('<span class="dn">'+esc(o.nm)+'</span>');
    if(fl.pid&&o.pid)top.push('<span class="dn">'+esc(o.pid)+'</span>');
    if(fl.stage)top.push('<span class="dstage">'+esc(LT.stage.replace('%n',sc.no))+'</span>');
    var dv=fl.wear?mmdd(sc.wearDate):(fl.change?mmdd(sc.changeDate):sc.no);
    var sub=(fl.wear&&fl.change)?'<div class="dsub">'+esc(LT.change)+' '+mmdd(sc.changeDate)+'</div>':'';
    return '<div class="cell cellD">'+(top.length?'<div class="dtop">'+top.join('<span class="dsp"></span>')+'</div>':'')+'<div class="dbig">'+(o.mono?'':TOOTH)+'<span>'+dv+'</span></div>'+sub+'</div>';
  }
  var perPage=75,pages='';var mk=style==='D'?cellD:cellC;
  for(var st=0;st<stages.length;st+=perPage){var chunk=stages.slice(st,st+perPage),cells='';
    for(var i=0;i<chunk.length;i++)cells+=mk(chunk[i]);
    for(var k=chunk.length;k<perPage;k++)cells+='<div class="cell"></div>';
    pages+='<div class="sheet"><div class="grid" style="transform:translate('+(o.offX||0)+'mm,'+(o.offY||0)+'mm)">'+cells+'</div></div>';}
  var HEAD=o.mono?'#000':'#111', ACC=o.mono?'#000':'#1c584f', CH=o.mono?'#000':'#9a3c37';
  var css="@page{size:A4;margin:0}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:'Noto Sans TC','Noto Sans JP',sans-serif}body{margin:0}"
   +".sheet{width:210mm;height:297mm;overflow:hidden;page-break-after:always;position:relative}"
   +".grid{position:absolute;top:2.25mm;left:0;display:grid;grid-template-columns:repeat(5,42mm);grid-auto-rows:19.5mm}"
   +".cell{width:42mm;height:19.5mm;border:0.3mm solid "+HEAD+";overflow:hidden;display:flex;flex-direction:column;background:#fff}"
   +".tth{width:3mm;height:3mm;vertical-align:-0.4mm;fill:"+HEAD+"}"
   /* C */
   +".lhead{background:"+HEAD+";color:#fff;font-weight:800;font-size:8pt;text-align:center;line-height:1.35;padding:0.3mm 1mm;white-space:nowrap;overflow:hidden}"
   +".hstage{color:"+(o.mono?'#fff':'#8fe3d3')+"}.hpid{color:#ccc;font-weight:400;font-size:7pt}"
   +".lbody{flex:1;display:flex;align-items:center;justify-content:center;gap:1.5mm;padding:0 2mm}"
   +".lwlab{font-size:7.5pt;color:#333;display:flex;align-items:center;gap:0.5mm;white-space:nowrap}"
   +".lbig{font-weight:800;font-size:17pt;letter-spacing:0.3pt;color:"+HEAD+"}"
   +".csub{text-align:center;font-size:7pt;color:"+CH+";line-height:1;padding-bottom:0.6mm}"
   /* D */
   +".cellD{padding:0.6mm 2mm;justify-content:center}"
   +".dtop{display:flex;justify-content:space-between;align-items:center;font-size:7.5pt;gap:1mm}"
   +".dn{font-weight:700;color:"+HEAD+";white-space:nowrap;overflow:hidden}.dstage{font-weight:800;color:"+ACC+";white-space:nowrap}.dsp{flex:1}"
   +".dbig{display:flex;align-items:center;justify-content:center;gap:1mm;font-weight:800;font-size:19pt;line-height:1;margin:0.2mm 0;color:"+HEAD+"}"
   +".dsub{text-align:center;font-size:7pt;color:"+CH+";line-height:1}";
  return '<!doctype html><html><head><meta charset="utf-8"><title>A4 貼紙</title><style>'+css+'</style></head><body>'+pages+'</body></html>';
}

function printLabels(){
  var p=buildPatient();if(!p)return;
  var lang=document.getElementById('f_lang').value;
  var stages=stageList(p);if(!stages.length){toast('無法產生排程');return;}
  var fields={name:document.getElementById('lb_name').checked,pid:document.getElementById('lb_pid').checked,
    stage:document.getElementById('lb_stage').checked,wear:document.getElementById('lb_wear').checked,
    change:document.getElementById('lb_change').checked};
  var offX=parseFloat(document.getElementById('cal_x').value)||0;
  var offY=parseFloat(document.getElementById('cal_y').value)||0;
  var style=(document.getElementById('lb_styleD')&&document.getElementById('lb_styleD').checked)?'D':'C';
  var mono=document.getElementById('f_mono').checked;
  var nm=docName(p,lang);var pid=p.invisalignPID?('PID '+p.invisalignPID):'';
  var html=algA4LabelSheetHTML(stages,{nm:nm,pid:pid,fields:fields,lang:lang,offX:offX,offY:offY,style:style,mono:mono});
  var w=window.open('','_blank');if(!w){toast('請允許彈出視窗');return;}
  w.document.write(html);w.document.close();setTimeout(function(){try{w.focus();w.print();}catch(e){}},400);
}
function genA4(){
  var p=buildPatient();if(!p)return;
  var lang=document.getElementById('f_lang').value;
  var mono=document.getElementById('f_mono').checked;
  var paid=document.getElementById('f_paid').checked;
  try{printA4Schedule(p,lang,p.wearType,mono,null,paid);}catch(e){toast('產生失敗：'+e.message);}
}

function pickStyle(st){document.getElementById('lb_styleD').checked=(st==='D');document.getElementById('segC').classList.toggle('on',st==='C');document.getElementById('segD').classList.toggle('on',st==='D');}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
document.getElementById('f_start').value=todayStr();
</script>
